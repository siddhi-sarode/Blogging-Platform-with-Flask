<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Internship Project</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        .navbar { background-color: #2c3e50; padding: 1rem 2rem; color: white; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin-left: 15px; font-weight: 500; }
        .navbar a:hover { color: #3498db; }
        .container { max-width: 450px; margin: 60px auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #3498db; outline: none; }
        .btn { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.3s; }
        .btn:hover { background-color: #2980b9; }
        .text-center { text-align: center; margin-top: 20px; display: block; text-decoration: none; color: #3498db; font-size: 14px; }
        .text-center:hover { text-decoration: underline; }
        .alert { padding: 12px; background-color: #e74c3c; color: white; margin-bottom: 20px; border-radius: 6px; text-align: center; font-size: 14px; }
        .dashboard-content { text-align: center; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div><strong>DIY Project</strong></div>
        <div>
            {% if current_user.is_authenticated %}
                <a href="/dashboard">Dashboard</a>
                <a href="/logout">Logout</a>
            {% else %}
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            {% endif %}
        </div>
    </div>
    
    <div class="container">
        <!-- This block catches and displays error messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <!-- This is where the specific page content gets injected -->
        {% block content %}{% endblock %}
    </div>
</body>
</html>
